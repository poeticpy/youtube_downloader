name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yt-dlp pyinstaller
      - run: pyinstaller --onefile --console youtube_downloader.py
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube下载器
          path: dist/youtube_downloader.exe
